# ============================================================================
# open-orpheus 龙芯 (loong64 / LoongArch) 编译流水线
# 系统: deepin 25 (crimson) | Electron: darkyzhou 移植 v42.3.0 | Node: 24.20.0
# 镜像: linuxdeepin/deepin:crimson-loong64-v1.6.0
# ============================================================================
#
# 关键结论 / 需知:
#   1. 项目 pin 了 electron@43.3.0，但 loong64 移植(darkyzhou/electron-loong64)
#      目前最高只有 v42.3.0，因此必须把 Electron 降级到 42.3.0。
#   2. @electron/packager 的官方架构白名单不含 loong64，会直接报
#      "Unsupported arch=loong64"。只有当 packagerConfig.download.mirrorOptions
#      存在时才会跳过该校验，故本流水线会给 forge.config.ts 注入 mirrorOptions。
#   3. Electron 二进制需要 glibc >= 2.38 且 CPU 支持 LSX（deepin crimson 满足，
#      仅运行时需要，不影响打包）。
#   4. AppImage / Flatpak / Rpm 三个 maker 在 loong64 下不可用
#      (appimagetool 无 loong64 二进制等)，因此只用 `electron-forge package`
#      产出目录，再手动打成 tar.gz（或后续改用 maker-deb）。

name: 编译 open-orpheus (loong64 / deepin 25)

on:
  workflow_dispatch:

env:
  NODE_VERSION: 24.20.0          # unofficial-builds 的 loong64 版本（项目要求 node>=24）
  PNPM_VERSION: 11.20.0          # 与 package.json 的 packageManager 一致
  ELECTRON_VERSION: 42.3.0       # loong64 移植最高版本（项目原为 43.3.0，需降级）
  WASM_BINDGEN_VERSION: 0.2.123  # 与根 Cargo.toml 中 wasm-bindgen 版本一致
  ELECTRON_MIRROR: https://github.com/darkyzhou/electron-loong64/releases/download/

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（loong64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 在 deepin-loong64 容器中编译
        timeout-minutes: 300
        run: |
          docker run --rm --platform linux/loong64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e NODE_VERSION="${NODE_VERSION}" \
            -e PNPM_VERSION="${PNPM_VERSION}" \
            -e ELECTRON_VERSION="${ELECTRON_VERSION}" \
            -e WASM_BINDGEN_VERSION="${WASM_BINDGEN_VERSION}" \
            -e ELECTRON_MIRROR="${ELECTRON_MIRROR}" \
            -e ELECTRON_USE_REMOTE_CHECKSUMS=1 \
            -e electron_use_remote_checksums=1 \
            linuxdeepin/deepin:crimson-loong64-v1.6.0 \
            bash -c '
              set -euo pipefail

              # ---------- 0. 环境确认 ----------
              echo "==> 架构: $(uname -m)"
              echo "==> glibc: $(ldd --version | head -1)"

              # ---------- 1. 基础工具 ----------
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git unzip xz-utils \
                build-essential python3 pkg-config libtool \
                libdbus-1-dev

              # ---------- 2. 安装 Node.js 24 (loong64) ----------
              curl -fsSL -o /tmp/node.tar.xz \
                "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-loong64.tar.xz"
              mkdir -p /opt/node
              tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
              ln -sf /opt/node/bin/node   /usr/local/bin/node
              ln -sf /opt/node/bin/npm    /usr/local/bin/npm
              ln -sf /opt/node/bin/npx    /usr/local/bin/npx
              export PATH="/opt/node/bin:$PATH"
              node -v && npm -v

              # ---------- 3. 安装 pnpm ----------
              npm install -g "pnpm@${PNPM_VERSION}"
              pnpm -v

              # ---------- 4. 安装 Rust（loong64 host + wasm32 目标） ----------
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              rustc -Vv | grep host || true
              rustup target add wasm32-unknown-unknown
              # wasm-bindgen CLI 版本必须与 Cargo.toml 中 wasm-bindgen 一致
              cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

              # ---------- 5. Electron 降级到 loong64 移植版本 ----------
              # pnpm 的 allowBuilds 已含 electron，postinstall 会用 ELECTRON_MIRROR
              # 自动下载 electron-v42.3.0-linux-loong64.zip
              # 注意: open-orpheus 是 pnpm 工作区，往根 package.json 加 devDependency
              # 必须显式带 -w (--workspace-root)，否则报 ERR_PNPM_ADDING_TO_ROOT
              pnpm add -D -w "electron@${ELECTRON_VERSION}"

              # ---------- 6. 注入 mirrorOptions 绕过 arch 校验 ----------
              # @electron/packager 官方白名单无 loong64；存在 mirrorOptions 时跳过校验，
              # 并让 @electron/get 从 darkyzhou 镜像下载 loong64 二进制。
              node -e "
                const fs = require(\"fs\");
                const f = \"forge.config.ts\";
                let s = fs.readFileSync(f, \"utf8\");
                if (!s.includes(\"mirrorOptions\")) {
                  const inject =
                    \"    download: {\\n\" +
                    \"      mirrorOptions: { mirror: \\\"${ELECTRON_MIRROR}\\\" },\\n\" +
                    \"    },\\n\";
                  s = s.replace(\"  packagerConfig: {\\n\", \"  packagerConfig: {\\n\" + inject);
                  fs.writeFileSync(f, s);
                }
              "

              # ---------- 7. 安装依赖 ----------
              pnpm install --no-frozen-lockfile

              # ---------- 8. 编译 Rust 模块（napi 原生 + WASM） ----------
              # modules/*: database/window/ui/dbus/smtc/nowplaying 用 napi 3.0 编译
              # loong64 原生 .node；audio-effect 用 wasm-bindgen 编成 WASM。
              pnpm build:modules

              # ---------- 9. 打包（仅 package，跳过不可用的 maker） ----------
              pnpm package -- --platform linux --arch loong64

              # ---------- 10. 产出 tar.gz ----------
              cd out
              tar -czf open-orpheus-linux-loong64.tar.gz open-orpheus-linux-loong64
              ls -lh
              echo "==> 构建完成: out/open-orpheus-linux-loong64"
            '

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: open-orpheus-linux-loong64
          path: |
            out/open-orpheus-linux-loong64/
            out/open-orpheus-linux-loong64.tar.gz
          if-no-files-found: error
