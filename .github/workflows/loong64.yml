# ============================================================================
# open-orpheus 龙芯 (loong64 / LoongArch) 编译流水线
# 系统: deepin 25 (crimson) | Electron: darkyzhou 移植 v42.3.0 | Node: 24.20.0
# 镜像: linuxdeepin/deepin:crimson-loong64-v1.6.0
# ============================================================================
#
# 关键结论 / 需知:
#   1. 项目 pin 了 electron@43.3.0，但 loong64 移植(darkyzhou/electron-loong64)
#      目前最高只有 v42.3.0，因此必须把 Electron 降级到 42.3.0。
#   2. @electron/packager 的官方架构白名单不含 loong64，会直接报
#      "Unsupported arch=loong64"。只有当 packagerConfig.download.mirrorOptions
#      存在时才会跳过该校验，故本流水线会给 forge.config.ts 注入 mirrorOptions。
#   3. Electron 二进制需要 glibc >= 2.38 且 CPU 支持 LSX（deepin crimson 满足，
#      仅运行时需要，不影响打包）。
#   4. AppImage / Flatpak / Rpm 三个 maker 在 loong64 下不可用
#      (appimagetool 无 loong64 二进制等)，因此只用 `electron-forge package`
#      产出目录，再手动打成 tar.gz（或后续改用 maker-deb）。
#   5. 两个构建期原生依赖缺 loong64 二进制, 需装 WASM 回退(见步骤 7.5):
#        - rolldown(vite8/tsdown 依赖): 无 loong64, WASM 回退 @rolldown/binding-wasm32-wasi
#        - @tailwindcss/oxide(Tailwind v4 依赖): 无 loong64, WASM 回退 @tailwindcss/oxide-wasm32-wasi
#      而 esbuild(@esbuild/linux-loong64) 与 unrs-resolver(loongarch64-unknown-linux-gnu)
#      均已原生支持 loong64, 无需处理。
#   6. 两个"运行时"原生依赖的处理(见步骤 7.6 / 7.7):
#        - music-tag-native(napi-rs, 读音乐标签): 无 loong64 原生二进制, 但 napi loader
#          找不到原生二进制时会自动回退 require("music-tag-native-wasm32-wasi")。
#          该 WASI 包已发布且版本须与主包一致, 需显式安装到 dependencies(而非 -D),
#          否则 electron-forge 打包不会带入应用, 运行时直接崩。
#        - @silvia-odwyer/photon-node(图像处理): 实为 wasm-bindgen 产物
#          (photon_rs.js + photon_rs_bg.wasm), 纯 WebAssembly、架构无关, loong64 可直接跑,
#          无需任何处理(仅做冒烟自检)。

name: 编译 open-orpheus (loong64 / deepin 25)

on:
  workflow_dispatch:

env:
  NODE_VERSION: 24.20.0          # unofficial-builds 的 loong64 版本（项目要求 node>=24）
  PNPM_VERSION: 11.20.0          # 与 package.json 的 packageManager 一致
  ELECTRON_VERSION: 42.3.0       # loong64 移植最高版本（项目原为 43.3.0，需降级）
  WASM_BINDGEN_VERSION: 0.2.123  # 与根 Cargo.toml 中 wasm-bindgen 版本一致
  ELECTRON_MIRROR: https://github.com/darkyzhou/electron-loong64/releases/download/

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（loong64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 在 deepin-loong64 容器中编译
        timeout-minutes: 300
        run: |
          docker run --rm --platform linux/loong64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e NODE_VERSION="${NODE_VERSION}" \
            -e PNPM_VERSION="${PNPM_VERSION}" \
            -e ELECTRON_VERSION="${ELECTRON_VERSION}" \
            -e WASM_BINDGEN_VERSION="${WASM_BINDGEN_VERSION}" \
            -e ELECTRON_MIRROR="${ELECTRON_MIRROR}" \
            -e ELECTRON_USE_REMOTE_CHECKSUMS=1 \
            -e electron_use_remote_checksums=1 \
            linuxdeepin/deepin:crimson-loong64-v1.6.0 \
            bash -c '
              set -euo pipefail

              # ---------- 0. 环境确认 ----------
              echo "==> 架构: $(uname -m)"
              echo "==> glibc: $(ldd --version | head -1)"

              # ---------- 1. 基础工具 ----------
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git unzip xz-utils \
                build-essential python3 pkg-config libtool \
                libdbus-1-dev

              # ---------- 2. 安装 Node.js 24 (loong64) ----------
              curl -fsSL -o /tmp/node.tar.xz \
                "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-loong64.tar.xz"
              mkdir -p /opt/node
              tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
              ln -sf /opt/node/bin/node   /usr/local/bin/node
              ln -sf /opt/node/bin/npm    /usr/local/bin/npm
              ln -sf /opt/node/bin/npx    /usr/local/bin/npx
              export PATH="/opt/node/bin:$PATH"
              node -v && npm -v

              # ---------- 3. 安装 pnpm ----------
              npm install -g "pnpm@${PNPM_VERSION}"
              pnpm -v

              # ---------- 4. 安装 Rust（loong64 host + wasm32 目标） ----------
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              rustc -Vv | grep host || true
              rustup target add wasm32-unknown-unknown
              # wasm-bindgen CLI 版本必须与 Cargo.toml 中 wasm-bindgen 一致
              cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

              # ---------- 5. Electron 降级到 loong64 移植版本 ----------
              # pnpm 的 allowBuilds 已含 electron，postinstall 会用 ELECTRON_MIRROR
              # 自动下载 electron-v42.3.0-linux-loong64.zip
              # 注意: open-orpheus 是 pnpm 工作区，往根 package.json 加 devDependency
              # 必须显式带 -w (--workspace-root)，否则报 ERR_PNPM_ADDING_TO_ROOT
              pnpm add -D -w "electron@${ELECTRON_VERSION}"

              # ---------- 6. 注入 mirrorOptions 绕过 arch 校验 ----------
              # @electron/packager 官方白名单无 loong64；存在 mirrorOptions 时跳过校验，
              # 并让 @electron/get 从 darkyzhou 镜像下载 loong64 二进制。
              node -e "
                const fs = require(\"fs\");
                const f = \"forge.config.ts\";
                let s = fs.readFileSync(f, \"utf8\");
                if (!s.includes(\"mirrorOptions\")) {
                  const inject =
                    \"    download: {\\n\" +
                    \"      mirrorOptions: { mirror: \\\"${ELECTRON_MIRROR}\\\" },\\n\" +
                    \"    },\\n\";
                  s = s.replace(\"  packagerConfig: {\\n\", \"  packagerConfig: {\\n\" + inject);
                  fs.writeFileSync(f, s);
                }
              "

              # ---------- 7. 安装依赖 ----------
              pnpm install --no-frozen-lockfile

              # ---------- 7.5 给缺 loong64 原生二进制的构建期依赖安装 WASM 回退 ----------
              # 说明: rolldown(vite8/tsdown 依赖) 与 @tailwindcss/oxide(Tailwind v4 依赖)
              # 官方均未发布 loong64 原生二进制, 但其 napi 加载器在找不到原生二进制时
              # 会自动回退到 WASM 构建。rolldown 的 WASM 回退包甚至不在 optionalDependencies
              # 里, 必须显式安装; tailwind oxide 的在 optionalDependencies 里但 pnpm 不会
              # 默认装到 loong64。这里按实际解析到的版本安装匹配的 -wasm32-wasi 包,
              # 加 -D 使其作为 devDependency, 不会打进最终应用包。
              # (Node 24 的 WASI 已稳定, 不再需要 --experimental-wasi-unstable-preview1 标志)

              ROLLDOWN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync(require.resolve('rolldown/package.json'),'utf8')).version" 2>/dev/null || echo "")
              OXIDE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync(require.resolve('@tailwindcss/oxide/package.json'),'utf8')).version" 2>/dev/null || echo "")
              echo "==> 已解析版本: rolldown@${ROLLDOWN_VERSION} | @tailwindcss/oxide@${OXIDE_VERSION}"

              WASM_PKGS=""
              [ -n "$ROLLDOWN_VERSION" ] && WASM_PKGS="$WASM_PKGS @rolldown/binding-wasm32-wasi@${ROLLDOWN_VERSION}"
              [ -n "$OXIDE_VERSION" ] && WASM_PKGS="$WASM_PKGS @tailwindcss/oxide-wasm32-wasi@${OXIDE_VERSION}"

              if [ -n "$WASM_PKGS" ]; then
                echo "==> 安装 WASM 回退包:${WASM_PKGS}"
                # shellcheck disable=SC2086
                pnpm add -D -w $WASM_PKGS
              else
                echo "==> 未检测到需要 WASM 回退的依赖, 跳过"
              fi

              # ---------- 7.6 运行时原生依赖的 loong64 处理 ----------
              # music-tag-native(napi-rs): 无 loong64 原生二进制, 但 napi loader 在
              # 找不到原生二进制时会自动回退 require("music-tag-native-wasm32-wasi")。
              # 该 WASI 包已发布, 版本须与主包一致。注意必须装到 dependencies(不用 -D),
              # 否则 electron-forge 打包时不会把它带入应用包, 运行时 require 会失败。
              # (music-tag-native 本身在根 dependencies 里, 这里 -w 加到根 package.json)
              MUSICTAG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync(require.resolve('music-tag-native/package.json'),'utf8')).version" 2>/dev/null || echo "")
              if [ -n "$MUSICTAG_VERSION" ]; then
                echo "==> 安装 music-tag-native 的 WASI 回退: music-tag-native-wasm32-wasi@${MUSICTAG_VERSION}"
                pnpm add -w "music-tag-native-wasm32-wasi@${MUSICTAG_VERSION}"
              else
                echo "==> 未检测到 music-tag-native, 跳过"
              fi

              # ---------- 7.7 运行时原生模块冒烟自检 ----------
              # 打包前确认两个运行时依赖都能真正加载:
              #   - music-tag-native 通过 WASI 回退加载
              #   - @silvia-odwyer/photon-node 通过其内置 photon_rs_bg.wasm 加载
              # 若失败则直接中断(比运行时才暴露强)。QEMU 模拟下 WASM 实例化较慢但可跑。
              node -e "
                const mods = ['music-tag-native', '@silvia-odwyer/photon-node'];
                let ok = true;
                for (const m of mods) {
                  try {
                    const x = require(m);
                    console.log('SMOKE OK   ' + m + ' -> ' + typeof x);
                  } catch (e) {
                    ok = false;
                    console.error('SMOKE FAIL ' + m + ': ' + (e && e.message));
                  }
                }
                if (!ok) process.exit(1);
              "

              # ---------- 8. 编译 Rust 模块（napi 原生 + WASM） ----------
              # modules/*: database/window/ui/dbus/smtc/nowplaying 用 napi 3.0 编译
              # loong64 原生 .node；audio-effect 用 wasm-bindgen 编成 WASM。
              pnpm build:modules

              # ---------- 9. 打包（仅 package，跳过不可用的 maker） ----------
              pnpm package -- --platform linux --arch loong64

              # ---------- 10. 产出 tar.gz ----------
              cd out
              tar -czf open-orpheus-linux-loong64.tar.gz open-orpheus-linux-loong64
              ls -lh
              echo "==> 构建完成: out/open-orpheus-linux-loong64"
            '

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: open-orpheus-linux-loong64
          path: |
            out/open-orpheus-linux-loong64/
            out/open-orpheus-linux-loong64.tar.gz
          if-no-files-found: error
